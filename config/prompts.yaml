# ChatGPT 프롬프트 템플릿

# 1단계: 회사/직무 정보 조사 요청
company_research: |
  나는 {company_name} {job_title}/{position} 에 지원하려고 해.
  자기소개서 작성을 위해 아래 항목들을 정확히 조사해줘.
  공식 채용 공고(지원 회사 채용 사이트, 사람인, 잡코리아 등)를 우선적으로 참고하고,
  없으면 최근 기사나 홈페이지 내용을 활용해줘.

  조사 항목:
  - 회사정보
  - 지원회사
  - 회사소개
  - 팀 소개
  - 공고명
  - 지원직무
  - 담당업무
  - 자격요건 / 우대사항
  - 미션 / 비전
  - 핵심가치
  - 인재상
  - 내가 어필할 부분

  형식:
  - 항목별로 표로 정리 (없으면 N/A라고 기재)
  - 마지막에 자기소개서 답변에 활용할 수 있는 포인트를 요약해줘

# 2단계: 자기소개서 작성 규칙
writing_rules: |
  완벽해! 이제부터 {company_name} {position} 자기소개서 문항들에 답변할 거야.

  **중요한 규칙:**
  1) 답변은 오직 자기소개서 본문만 작성해줘 (메타 설명, 가이드, 초안 표시 등 일체 금지)
  2) 마크다운 기호(**, ##, 💚 등), 이모지, 강조 표시 절대 사용하지 마
  3) 프로젝트명은 직접 언급하지 말고 "프로젝트", "팀 과제" 등으로 표현
  4) 각 문항마다 다른 경험/주제로 답변 (같은 내용 반복 금지)
  5) 글자수의 85~95% 분량으로 작성
  6) 본문만 깔끔하게 작성 (제목, 설명 없이)

  알겠으면 "알겠습니다"라고만 답변해.

# 3단계: 각 문항 질문 템플릿
question_template: |
  문항 {number}: {question}
  글자수 제한: {char_limit}자
